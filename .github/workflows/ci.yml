name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  checks: write
  pull-requests: write
  # Required by dorny/test-reporter to read back the workflow run's own context when attaching its
  # check run -- without it, the action's "Publish test results" step reports success but silently
  # skips creating the check run (no fail-on-error set, so the internal permission error is just a
  # warning, not a step failure).
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Official Gradle-maintained action -- handles Gradle/dependency caching between runs and adds
      # a build summary (with build scan links, if any) to the job; on failure it also posts that
      # summary as a PR comment.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary-as-pr-comment: on-failure

      # ktlintCheck is a separate step (not folded into `build`) purely so a lint failure is visually
      # distinct from a test failure in the Actions UI -- it doesn't require compilation, so it's cheap
      # to run on its own.
      - name: Ktlint check
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew test

      # Publishes a per-test pass/fail breakdown (as a GitHub Check Run) from every module's JUnit XML
      # output -- runs even if the previous step failed, so failing tests are still visible in detail.
      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit
